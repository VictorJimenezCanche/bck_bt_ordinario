name: Deploy Backend to GHCR and Render

on:
  push:
    branches:
      - main

permissions:
  contents: read 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR (Using Repository Secret)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} 
          password: ${{ secrets.GHCR_PAT }} 

      - name: Build and push images
        run: |
        
          REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/$REPO_LOWER"
          
          
          SHA_TAG="${IMAGE_NAME}:${{ github.sha }}"
        
          LATEST_TAG="${IMAGE_NAME}:latest"
          
          echo "Building image $LATEST_TAG..."
          docker build -t $SHA_TAG -t $LATEST_TAG .
          
          echo "Pushing images..."
          docker push $SHA_TAG
          docker push $LATEST_TAG

      - name: Notify Render to Deploy New Image
        run: |
          echo "Triggering Render deployment using WebHook..."
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}