name: Deploy Backend to GHCR and Render

on:
  push:
    branches:
      - main

env:
  IMAGE_BASE: ghcr.io/victorjimenezcanche/bck_bt_ordinario/flask-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to GHCR
      run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build image with commit SHA tag
      run: docker build -t $IMAGE_BASE:${{ github.sha }} .

    - name: Push image with commit SHA tag
      run: docker push $IMAGE_BASE:${{ github.sha }}

    - name: Also tag as latest
      run: |
        docker tag $IMAGE_BASE:${{ github.sha }} $IMAGE_BASE:latest
        docker push $IMAGE_BASE:latest
